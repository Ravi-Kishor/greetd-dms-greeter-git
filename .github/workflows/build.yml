name: Build greetd-dms-greeter-git (x86-64-v3)

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Check out packaging repository
        uses: actions/checkout@v4

      - name: Update system and install build tools
        shell: bash
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            base-devel \
            binutils \
            git \
            go \
            make \
            sudo \
            greetd \
            quickshell

      - name: Verify Go toolchain and PKGBUILD
        shell: bash
        run: |
          set -euo pipefail
          test -f PKGBUILD || {
            echo "::error::PKGBUILD was not found in the checked-out packaging repository."
            exit 1
          }

          go version
          GO_VERSION="$(go env GOVERSION | sed 's/^go//')"
          if [[ "$(printf '%s\n' 1.27 "$GO_VERSION" | sort -V | head -n1)" != "1.27" ]]; then
            echo "::error::dux-greeter requires Go 1.27 or newer; found $GO_VERSION"
            exit 1
          fi

      - name: Create unprivileged builder
        shell: bash
        run: |
          set -euo pipefail
          useradd --create-home builder
          printf 'builder ALL=(ALL:ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build x86-64-v3 package
        shell: bash
        run: |
          set -euo pipefail
          su builder -s /bin/bash -c \
            "cd '$GITHUB_WORKSPACE' && export GOAMD64=v3 && makepkg --syncdeps --cleanbuild --noconfirm"

      - name: Verify package and prepare release
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=( ./*.pkg.tar.zst )
          filtered=()
          for package in "${packages[@]}"; do
            [[ "$package" == *debug* ]] || filtered+=( "$package" )
          done

          if (( ${#filtered[@]} != 1 )); then
            echo "::error::Expected exactly one non-debug package, found ${#filtered[@]}"
            printf '%s\n' "${filtered[@]}"
            exit 1
          fi

          PKG="${filtered[0]}"
          BASE="$(basename "$PKG")"
          if [[ "$BASE" =~ ^greetd-dms-greeter-git-(.+)-x86_64\.pkg\.tar\.zst$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            echo "::error::Unexpected package filename: $BASE"
            exit 1
          fi

          mkdir -p release verify
          cp "$PKG" "release/$BASE"
          sha256sum "release/$BASE" > "release/$BASE.sha256"

          bsdtar -xOf "$PKG" usr/bin/dms-greeter > verify/dms-greeter
          chmod +x verify/dms-greeter
          go version -m verify/dms-greeter | tee verify/go-build-info.txt
          grep -Eq 'GOAMD64=v3' verify/go-build-info.txt || {
            echo "::error::Binary does not report GOAMD64=v3; check that PKGBUILD preserves the environment."
            exit 1
          }

          # The current upstream build reports -buildmode=exe, so do not
          # incorrectly require ELF Type DYN (PIE). Verify it is a valid
          # x86-64 ELF executable and retain the GOAMD64=v3 check above.
          readelf -h verify/dms-greeter | tee verify/elf-header.txt
          grep -Eq 'Class:[[:space:]]+ELF64' verify/elf-header.txt || {
            echo "::error::Expected an ELF64 binary."
            exit 1
          }
          grep -Eq 'Machine:[[:space:]]+Advanced Micro Devices X86-64' verify/elf-header.txt || {
            echo "::error::Expected an x86-64 executable."
            exit 1
          }

          SHA="${GITHUB_SHA::12}"
          test -n "$SHA" || {
            echo "::error::GITHUB_SHA is empty; refusing to create a release with an invalid tag."
            exit 1
          }
          TAG_VERSION="${VERSION//:/.}"
          test -n "$TAG_VERSION" || {
            echo "::error::Sanitized package version is empty."
            exit 1
          }

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag_version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        shell: bash
        env:
          TAG_VERSION: ${{ steps.pkg.outputs.tag_version }}
        run: |
          set -euo pipefail
          [[ -n "$TAG_VERSION" ]] || {
            echo "::error::Release tag version is empty."
            exit 1
          }
          [[ "$TAG_VERSION" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "::error::Release tag version contains invalid characters: $TAG_VERSION"
            exit 1
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: greetd-dms-greeter-v3-${{ steps.pkg.outputs.tag_version }}
          name: greetd-dms-greeter-git ${{ steps.pkg.outputs.version }} (x86-64-v3)
          body: |
            Automated x86-64-v3 build of `greetd-dms-greeter-git`.

            - Upstream project: https://github.com/duxlabs-dev/dux-greeter
            - Target: x86-64-v3 (Zen 3 and newer)
            - Build verification: Go build metadata checked for `GOAMD64=v3`; ELF64 x86-64 format checked with `readelf`.
            - Note: the current upstream build uses Go `-buildmode=exe`; this workflow does not claim PIE hardening.
            - Package checksum: included as a `.sha256` file.
          files: |
            release/*.pkg.tar.zst
            release/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}